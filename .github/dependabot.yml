# Weekly updates of dependencies, actions and the base image. Major versions
# of the stack are pinned on purpose (AGENTS.md, Stack): moving to one is a
# task of its own, so they are not proposed here. Actions are different:
# their majors mostly follow GitHub's runtime (Node 20 -> 24), and staying
# behind breaks CI — they come, every kind, in one pull request a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
