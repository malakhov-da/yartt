# Every push to master or a maintenance branch (v1.2) and every pull request: types, the API and database
# suite, and the end-to-end suite in Chrome — the same three checks every
# commit must pass (AGENTS.md, Commits). A release tag does not run them
# again: release.yml requires this workflow to have passed for the commit.
name: CI

on:
  push:
    # master and the maintenance branches of older lines (v1.2), released from too.
    branches: [master, 'v[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      # The whole history with tags: migrations are checked against db.sql at each release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The runner has Google Chrome; the suite uses it (playwright.config.ts, channel: chrome).
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: e2e-report/
          retention-days: 7
